name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build-x86-ubuntu:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        simd: &x86_simd [scalar, avx2]
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-latest
      cc: ${{ matrix.cc }}
      simd: ${{ matrix.simd }}

  build-x86-windows:
    strategy:
      fail-fast: false
      matrix:
        cc: [cl]
        simd: *x86_simd
    uses: ./.github/workflows/build.yml
    with:
      os: windows-latest
      cc: ${{ matrix.cc }}
      simd: ${{ matrix.simd }}

  build-arm64-macos:
    strategy:
      fail-fast: false
      matrix:
        cc: [clang]
        simd: [scalar]
    uses: ./.github/workflows/build.yml
    with:
      os: macos-latest
      cc: ${{ matrix.cc }}
      simd: ${{ matrix.simd }}

  sanitize:
    strategy:
      fail-fast: false
      matrix:
        simd: *x86_simd
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-latest
      cc: clang
      simd: ${{ matrix.simd }}
      cmake_args: -DEULERFOIL_SANITIZE=ON

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install clang-format==19.1.7

      - name: Check formatting
        run: |
          files=$(git ls-files '*.c' '*.h' ':!external/')
          if ! clang-format --dry-run --Werror $files; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              exit 1
            fi
            echo "::warning::Tree is not clang-formatted"
          fi

  tidy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simd: *x86_simd
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-tidy
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y clang-tidy-19
          sudo ln -sf /usr/bin/clang-tidy-19 /usr/local/bin/clang-tidy
          clang-tidy --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=clang-19 -DEF_SIMD=${{ matrix.simd }}

      - name: Run clang-tidy
        run: bash tidy.sh --warnings-as-errors='*'
